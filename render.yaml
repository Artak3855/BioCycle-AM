services:
  - type: web
    name: ecoloop-demo
    runtime: node
    plan: starter   # persistent disks are not available on the free plan
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DB_PATH
        value: /var/data/ecoloop.db
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: ecoloop-data
      mountPath: /var/data
      sizeGB: 1
